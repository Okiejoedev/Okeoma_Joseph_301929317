# Optional local environment for Portfolios 1-4 (same major versions as the evidence).
# Usage: docker compose up -d   then   PGHOST=localhost ./rebuild.sh
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust      # local coursework only - never in production
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "work_mem=16MB"]
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  mongo:
    image: mongo:8
    ports: ["27017:27017"]
    volumes: ["mongodata:/data/db"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
  mongodata:
